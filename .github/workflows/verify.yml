name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # The tamper controls run here too: a verifier that cannot fail would
      # make the verification step below meaningless.
      - name: Tests and tamper controls
        run: pytest -q

      - name: Verify every figure and table
        if: always()
        run: python -m rwxai verify --all --report verification_report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: verification_report.json
